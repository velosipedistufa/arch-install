# https://yazi-rs.github.io/docs/configuration/keymap
#:schema https://yazi-rs.github.io/schemas/keymap.json

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = "cd sftp://nas//home/alex/raid"
desc = "Go to NAS raid"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "cd sftp://nas//mnt/ssd"
desc = "Go to NAS SSD"

[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = "plugin usb"
desc = "USB drive: mount if needed and open (dark icon = unmounted)"

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = '''shell --block -- "$HOME/.local/bin/nextcloud-ensure" && ya emit cd "$HOME/.local/mnt/nextcloud"'''
desc = "Nextcloud"
